<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPTV Player</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body{
margin:0;
background:#000;
font-family:Arial;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
width:100%;
max-width:900px;
}

video{
width:100%;
background:black;
border-radius:10px;
}
</style>
</head>

<body>

<div class="container">
<video id="video" controls autoplay></video>
</div>

<script>
const video = document.getElementById("video");

// 📺 رابط القناة
const url = "http://het136a.ycn-redirect.com/live/918454578001/index.m3u8?t=224lgpQLc9fLol94VjPgLQ&e=1779124013";

// ▶️ تشغيل البث
function playStream(streamUrl){

if(Hls.isSupported()){
const hls = new Hls({
enableWorker: true
});

hls.loadSource(streamUrl);
hls.attachMedia(video);

hls.on(Hls.Events.ERROR, function(event, data){
console.log("HLS Error:", data);
});

}
else if(video.canPlayType("application/vnd.apple.mpegurl")){
video.src = streamUrl;
}
else{
alert("المتصفح لا يدعم تشغيل البث");
}
}

playStream(url);
</script>

</body>
</html>
